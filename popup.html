<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Page Time Tracker</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <span class="dot"></span>
        <span>Page Time Tracker</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabledToggle" />
        <span class="slider"></span>
      </label>
    </header>

    <div id="emptyState" class="empty" hidden>
      No time tracked yet today. Browse a page and the widget will start counting.
    </div>

    <ul id="siteList" class="site-list"></ul>

    <div class="alert-row">
      <label for="alertMinutes">Alert after</label>
      <input type="number" id="alertMinutes" min="0" step="5" />
      <span class="alert-suffix">min/site &middot; 0 = off</span>
    </div>

    <footer>
      <button id="resetBtn" class="reset-btn">Reset today's data</button>
      <button id="statsBtn" class="stats-btn">Statistics</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
